<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="font-family: Arial, sans-serif;">
  <defs>
    <!-- Text Paths for Circular Alignment -->
    <path id="textPathTop" d="M 90,210 A 110,110 0 0,1 310,210" fill="none"/>
    <path id="ribbonPath" d="M 60,305 Q 200,335 340,305" fill="none"/>
    
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
  </defs>

  <!-- TOP BLUE GOPURAM SPIRE -->
  <g transform="translate(200, 32)">
    <polygon points="0,0 -12,18 12,18" fill="#1e3a8a"/>
    <rect x="-18" y="18" width="36" height="6" fill="#1e3a8a"/>
    <rect x="-24" y="26" width="48" height="7" fill="#1e3a8a"/>
    <rect x="-32" y="35" width="64" height="8" fill="#1e3a8a"/>
    <!-- White divider lines on Gopuram -->
    <line x1="-16" y1="21" x2="16" y2="21" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-22" y1="29" x2="22" y2="29" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="-30" y1="39" x2="30" y2="39" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- RED LOTUS PETAL OUTER BORDER -->
  <g>
    <!-- 28 Lotus Petals Ring -->
    <!-- Center (200, 210), R=126 -->
    <circle cx="200" cy="210" r="132" fill="none" stroke="#d63031" stroke-width="1"/>
    
    <!-- Outer Red Emblem Circle -->
    <circle cx="200" cy="210" r="124" fill="#e11d48"/>
    
    <!-- Lotus Petal shapes along the border -->
    <path d="M 200,78 C 196,70 204,70 200,78 Z" fill="#e11d48"/>
  </g>

  <!-- RED RING WITH TEXT -->
  <circle cx="200" cy="210" r="124" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  
  <!-- INNER WHITE & BLUE SUNBURST CIRCLE -->
  <circle cx="200" cy="210" r="86" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Yellow Sun Center -->
  <circle cx="200" cy="210" r="62" fill="#facc15" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Radiating Sun Rays in Blue/White -->
  <g stroke="#1e3a8a" stroke-width="1.2" opacity="0.7">
    <line x1="200" y1="126" x2="200" y2="148"/>
    <line x1="200" y1="272" x2="200" y2="294"/>
    <line x1="116" y1="210" x2="138" y2="210"/>
    <line x1="262" y1="210" x2="284" y2="210"/>
    <line x1="140" y1="150" x2="156" y2="166"/>
    <line x1="260" y1="270" x2="244" y2="254"/>
    <line x1="140" y1="270" x2="156" y2="254"/>
    <line x1="260" y1="150" x2="244" y2="166"/>
    <line x1="125" y1="178" x2="144" y2="188"/>
    <line x1="275" y1="242" x2="256" y2="232"/>
    <line x1="125" y1="242" x2="144" y2="232"/>
    <line x1="275" y1="178" x2="256" y2="188"/>
  </g>

  <!-- CIRCULAR RED RING TEXT -->
  <text font-size="13.5" font-weight="900" fill="#ffffff" letter-spacing="1">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      SRI KRISHNA CHAITANYA EDUCATIONAL INSTITUTIONS
    </textPath>
  </text>

  <!-- CENTER PEACOCK FEATHER & FLUTE -->
  <g transform="translate(200, 192)">
    <!-- Peacock Feather Eye -->
    <ellipse cx="0" cy="-22" rx="10" ry="14" fill="#0284c7" stroke="#1e3a8a" stroke-width="1.5"/>
    <ellipse cx="0" cy="-22" rx="6" ry="9" fill="#facc15"/>
    <ellipse cx="0" cy="-22" rx="3" ry="5" fill="#0369a1"/>
    <!-- Feather Stem -->
    <path d="M 0,-8 C -2,0 -4,8 -6,15" stroke="#15803d" stroke-width="2" fill="none"/>

    <!-- Flute (Bansuri) -->
    <g transform="rotate(-6)">
      <rect x="-48" y="-3" width="96" height="6" rx="3" fill="#e2e8f0" stroke="#1e3a8a" stroke-width="1.5"/>
      <circle cx="-30" cy="0" r="1.2" fill="#1e3a8a"/>
      <circle cx="-15" cy="0" r="1.2" fill="#1e3a8a"/>
      <circle cx="0" cy="0" r="1.2" fill="#1e3a8a"/>
      <circle cx="15" cy="0" r="1.2" fill="#1e3a8a"/>
      <circle cx="30" cy="0" r="1.2" fill="#1e3a8a"/>
      <!-- Red Threads on Flute -->
      <line x1="-42" y1="-3" x2="-42" y2="3" stroke="#dc2626" stroke-width="2"/>
      <line x1="42" y1="-3" x2="42" y2="3" stroke="#dc2626" stroke-width="2"/>
    </g>
  </g>

  <!-- CENTER OPEN BOOK WITH "K C" -->
  <g transform="translate(200, 238)">
    <!-- Book Shadow & Outline -->
    <path d="M -42,-18 Q 0,-26 42,-18 L 42,16 Q 0,8 -42,16 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Center Spine Line -->
    <line x1="0" y1="-22" x2="0" y2="12" stroke="#1e3a8a" stroke-width="1.5"/>
    <!-- Page Lines -->
    <path d="M -38,-12 Q -20,-18 0,-12" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <path d="M 0,-12 Q 20,-18 38,-12" fill="none" stroke="#94a3b8" stroke-width="1"/>
    
    <!-- Bold Red "K" and "C" Text -->
    <text x="-20" y="2" fill="#dc2626" font-size="22" font-weight="900" font-family="Times New Roman, serif" text-anchor="middle">K</text>
    <text x="20" y="2" fill="#dc2626" font-size="22" font-weight="900" font-family="Times New Roman, serif" text-anchor="middle">C</text>
  </g>

  <!-- BOTTOM YELLOW RIBBON SLOGAN -->
  <g>
    <!-- Left Ribbon Fold -->
    <polygon points="35,310 65,290 65,325 30,335" fill="#ca8a04" stroke="#000000" stroke-width="1.5"/>
    <!-- Right Ribbon Fold -->
    <polygon points="365,310 335,290 335,325 370,335" fill="#ca8a04" stroke="#000000" stroke-width="1.5"/>

    <!-- Main Banner Ribbon Body -->
    <path d="M 45,300 Q 200,335 355,300 L 345,340 Q 200,375 55,340 Z" fill="url(#goldRibbon)" stroke="#000000" stroke-width="2"/>
    
    <!-- Banner Text -->
    <text font-size="14" font-weight="900" fill="#991b1b" font-family="Arial Black, sans-serif" letter-spacing="1">
      <textPath href="#ribbonPath" startOffset="50%" text-anchor="middle">
        EMPOWERMENT OF YOUNG MINDS
      </textPath>
    </text>
  </g>
</svg>
